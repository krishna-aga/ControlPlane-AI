# Org Baseline Policy
# Defines default enterprise guardrails and locks baseline safety fields.

policy_name: org-baseline
policy_version: v1.0.0
description: Enterprise-wide baseline security & privacy guardrails

# Default thresholds
pii_threshold: 0.8
grounding_threshold: 0.6
toxicity_threshold: 0.7

# Risk bands
low_band: 0.3
high_band: 0.7

# Semantic cache default
cache_threshold: 0.90

# Default detector weights for risk fusion
detector_weights:
  t0: 0.4
  pii: 0.2
  grounding: 0.2
  toxicity: 0.2

# Per-detector critical floors, on the NORMALIZED S scale (0.5 == detection threshold).
# A detector reaching its critical value floors fused risk at high_band regardless of
# weights. Without this, no single T1 detector can trigger any action: a 99%-confidence
# toxic response fuses to 0.197 and resolves to ALLOW.
detector_critical_thresholds:
  pii: 0.90
  grounding: 0.90
  toxicity: 0.95

# Tier 0 emits categorical severities rather than threshold-normalized scores.
t0_severity_scores:
  hard: 1.0
  high: 0.75
  medium: 0.40
  low: 0.15
t0_aggregation: max

# Tier 0 secret detection
secret_min_length: 24
secret_entropy_ratio_threshold: 0.9
blocklist_terms: []

# Tier 1 NER: spaCy exposes no per-entity confidence, so label reliability is
# supplied here and is a calibration target for the Learning Plane.
ner_label_confidence:
  PERSON: 0.85
  GPE: 0.75
  ORG: 0.70
pii_aggregation: max

# Input Gate: prompt injection.
# There is no 'sanitize' action. Lexical removal of a matched injection span forwards
# the remainder of the attack, so the ladder is allow | flag | block. 'flag' proceeds
# with the prompt UNMODIFIED and routes the injection score into risk fusion, which
# tightens the output cascade. See docs/INPUT_GATE.md
#
# NOTE: both values are set here, not merely listed in locked_fields. A field that is
# locked but unset in this baseline is never compared against anything, so the lock
# would silently do nothing.
injection_threshold: 0.7
injection_action: flag
injection_evasion_penalty: 0.15

# A FLAGged input contracts the output risk bands by this fraction, scaled by the
# injection score. This is what 'flag' actually does - see docs/RISK_FUSION.md
input_risk_tightening: 0.5

# Fields locked by enterprise compliance - inner layers can ONLY tighten these fields
locked_fields:
  - pii_threshold
  - grounding_threshold
  - toxicity_threshold
  - low_band
  - high_band
  - injection_threshold
  - injection_action
  - injection_evasion_penalty
  - input_risk_tightening
